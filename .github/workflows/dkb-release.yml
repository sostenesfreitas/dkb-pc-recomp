name: DKB setup zip

# Builds DKB-Setup-<version>-windows.zip: the portable tools, the source and the installer GUI, with no game data.
# A manual run or a push to a tag only uploads the zip as a workflow artifact; a tag named v* also publishes it as a
# GitHub pre-release (0.x is experimental, see docs/installer.md and issue #85).

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  zip:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # make_release.py stamps the commit into the version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v5   # make_release.py installs the installer's wheels with uv
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: python tools/check_content.py
      - run: python tools/build_xlate.py
      - run: python tools/make_release.py --game dkb --zip   # also runs check_content over the folder
      - uses: actions/upload-artifact@v4
        with:
          name: DKB-Setup-windows
          path: build/release/DKB-Setup-*-windows.zip
          if-no-files-found: error
      - name: Publish the pre-release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/release/DKB-Setup-*-windows.zip \
            --prerelease --title "$GITHUB_REF_NAME" --generate-notes
